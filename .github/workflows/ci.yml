name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "\${{ matrix.python }}"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: pytest -q
      - name: Eligible LOC audit
        run: |
          python - <<'PY'
          from pathlib import Path

          excluded = {".git", ".venv", "venv", "__pycache__", "node_modules"}
          files = [
              path
              for path in Path(".").rglob("*.py")
              if not any(part in excluded for part in path.parts)
          ]
          loc = sum(
              sum(1 for line in path.read_text(encoding="utf-8", errors="ignore").splitlines() if line.strip())
              for path in files
          )
          print(f"ELIGIBLE_FILES={len(files)}")
          print(f"ELIGIBLE_LOC={loc}")
          PY
