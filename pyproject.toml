[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-fte-agent"
version = "0.2.0"
description = "Event-driven Digital FTE task orchestration engine"
requires-python = ">=3.10"
dependencies = ["watchdog>=4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["digital_fte*"]

[project.scripts]
digital-fte = "digital_fte.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
